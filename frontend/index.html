<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-transparent.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CreatorAI</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        document.body.innerHTML += '<div style="color:red; background:white; padding:20px; z-index:99999; position:absolute; top:0; left:0; width:100%;"><h3>Javascript Error Crash:</h3><p>' + message + '</p><pre>' + (error ? error.stack : '') + '</pre></div>';
      };
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML += '<div style="color:red; background:white; padding:20px; z-index:99999; position:absolute; top:0; left:0; width:100%;"><h3>Unhandled Promise Rejection:</h3><p>' + event.reason + '</p></div>';
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
